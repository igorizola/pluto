name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: ./mvnw --batch-mode clean test

      - name: Build Docker image
        run: |
          # tag with short SHA so images from CI are unique
          docker build -t pluto:${{ github.sha }} .

      - name: Get Next Version
        id: semver
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ietf-tools/semver-action@v1
        with:
          token: ${{ github.token }}
          branch: main

      - name: Print version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo ${{ steps.semver.outputs.next }}
